<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MovieLens Recommendation Engine</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace">
        <div class="brand">
          <div class="brand-mark">ML</div>
          <div>
            <h1>MovieLens</h1>
            <p>Recommendation Engine</p>
          </div>
        </div>

        <form id="controls" class="control-panel">
          <label>
            <span>User ID</span>
            <input id="userId" name="userId" value="1" inputmode="numeric" autocomplete="off" />
          </label>

          <label>
            <span>Limit</span>
            <input id="limit" name="limit" type="number" min="1" max="50" value="12" />
          </label>

          <label>
            <span>Context Movie ID</span>
            <input id="contextId" name="contextId" inputmode="numeric" autocomplete="off" placeholder="optional" />
          </label>

          <div class="segmented" role="radiogroup" aria-label="Recommendation mode">
            <input id="modeHybrid" type="radio" name="mode" value="hybrid" checked />
            <label for="modeHybrid">Hybrid</label>
            <input id="modeContent" type="radio" name="mode" value="content" />
            <label for="modeContent">Content</label>
            <input id="modeCollab" type="radio" name="mode" value="collab" />
            <label for="modeCollab">Collab</label>
          </div>

          <div class="segmented compact" role="radiogroup" aria-label="Cache type">
            <input id="cacheSession" type="radio" name="cacheType" value="session" checked />
            <label for="cacheSession">Session</label>
            <input id="cacheOffline" type="radio" name="cacheType" value="offline" />
            <label for="cacheOffline">Offline</label>
          </div>

          <button class="primary-action" type="submit">Refresh Recommendations</button>
        </form>

        <form id="interactionForm" class="interaction-panel">
          <h2>Interaction</h2>
          <label>
            <span>Movie ID</span>
            <input id="interactionMovieId" inputmode="numeric" autocomplete="off" />
          </label>
          <label>
            <span>Rating</span>
            <input id="rating" type="number" min="0.5" max="5" step="0.5" value="4.5" />
          </label>
          <button type="submit">Queue Rating</button>
        </form>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live API Workspace</p>
            <h2 id="pageTitle">Hybrid Recommendations</h2>
          </div>
          <div id="status" class="status">Ready</div>
        </header>

        <section class="metrics-strip" aria-label="Metrics">
          <div>
            <span>Precision@K</span>
            <strong id="precision">--</strong>
          </div>
          <div>
            <span>Diversity</span>
            <strong id="diversity">--</strong>
          </div>
          <div>
            <span>Results</span>
            <strong id="resultCount">--</strong>
          </div>
        </section>

        <section id="results" class="movie-grid" aria-live="polite"></section>
        <section id="emptyState" class="empty-state" hidden>
          <h3>No recommendations returned</h3>
          <p>Check that MovieLens data has been imported and the selected user exists.</p>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
